name: Publish election dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect licensed feed
        env:
          AP_API_KEY: ${{ secrets.AP_API_KEY }}
          AP_ELECTIONS_URL: ${{ vars.AP_ELECTIONS_URL }}
        run: python src/fetch.py || true
      - name: Persist latest status
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/results.json data/fetch_status.json
          git diff --cached --quiet || (git commit -m 'Update election data snapshot' && git push)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
